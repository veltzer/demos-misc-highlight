# Repo-specific overlay. Deep-merged over the canonical rsconstruct.toml.

# The Makefile rendered each source/* file to five pygmentize formats (svg, jpg,
# html -O full, png, rtf) with a shared style. The generator drives
# scripts/highlight.py, which emits all five per source (pygmentize writes one
# format per run). DO_CONVERT was 0, so the imagemagick htm2jpg/htm2png follow-on
# conversions were off and are not reproduced.
[processor.generator.highlight]
command = "scripts/highlight.py"
src_dirs = ["source"]
src_extensions = [".rb", ".sh", ".pp"]
output_dir = "out"
output_extension = "svg"
batch = false

# pygments provides pygmentize; the png/jpg formats need Pillow.
[dependencies]
pip = [
    "pygments",
    "pillow",
]
