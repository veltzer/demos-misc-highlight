# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

[analyzer.python]

[processor.checker.ruff]
src_dirs = ["scripts"]


[processor.checker.pyrefly]
src_dirs = ["scripts"]

[processor.checker.taplo]
src_files = [".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

# ─── repo-specific configuration ────────────────────────────────────────────

# The Makefile rendered each source/* file to five pygmentize formats (svg, jpg,
# html -O full, png, rtf) with a shared style. One generator instance per
# format, so each output is declared: scripts/highlight.py renders the format
# its output's extension names. DO_CONVERT was 0, so the imagemagick
# htm2jpg/htm2png follow-on conversions were off and are not reproduced.
# required_tools: the script and pygmentize are Python, which writes bytecode.
[processor.generator.generic.highlight_svg]
command = "scripts/highlight.py"
src_dirs = ["source"]
src_extensions = [".rb", ".sh", ".pp"]
output_dir = "out"
output_extension = "svg"
batch = false
required_tools = ["python"]

[processor.generator.generic.highlight_jpg]
command = "scripts/highlight.py"
src_dirs = ["source"]
src_extensions = [".rb", ".sh", ".pp"]
output_dir = "out"
output_extension = "jpg"
batch = false
required_tools = ["python"]

[processor.generator.generic.highlight_html]
command = "scripts/highlight.py"
src_dirs = ["source"]
src_extensions = [".rb", ".sh", ".pp"]
output_dir = "out"
output_extension = "html"
batch = false
required_tools = ["python"]

[processor.generator.generic.highlight_png]
command = "scripts/highlight.py"
src_dirs = ["source"]
src_extensions = [".rb", ".sh", ".pp"]
output_dir = "out"
output_extension = "png"
batch = false
required_tools = ["python"]

[processor.generator.generic.highlight_rtf]
command = "scripts/highlight.py"
src_dirs = ["source"]
src_extensions = [".rb", ".sh", ".pp"]
output_dir = "out"
output_extension = "rtf"
batch = false
required_tools = ["python"]

# pygments provides pygmentize; the png/jpg formats need Pillow.

# lint the Lua configuration with luacheck (policy: .luacheckrc)
[processor.checker.iluacheck]
src_dirs = ["config"]

# lint the YAML files with yamllint (policy: .yamllint.yaml)
[processor.checker.iyamllint]
src_dirs = [".github"]
src_files = [".yamllint.yaml"]

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# audit the GitHub Actions workflow files for security problems with zizmor
# (policy: .github/zizmor.yml)
[processor.checker.zizmor]
src_dirs = [".github/workflows"]
# The pedantic persona: also the findings zizmor's default persona keeps
# quiet (undocumented permissions, template expansion of any context,
# unnamed jobs, ...). --offline and --no-progress are the default args.
args = ["--offline", "--no-progress", "--persona=pedantic"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl]
src_files = ["README.md"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.checker.ishellcheck]
src_dirs = ["source"]
